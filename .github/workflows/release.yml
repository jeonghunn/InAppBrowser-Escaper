name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # For npm provenance
    outputs:
      package-name: ${{ steps.metadata.outputs.name }}
      package-version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify release tag
        id: metadata
        run: node scripts/release-metadata.js

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify installed npm package
        run: npm run test:package

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## Changes
            
            See [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md) for details.
            
            ## Installation
            
            ```bash
            npm install ${{ needs.release.outputs.package-name }}@${{ needs.release.outputs.package-version }}
            ```
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
